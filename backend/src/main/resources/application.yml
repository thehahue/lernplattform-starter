spring:
  application:
    name: lernraum-starter
  datasource:
    # Relativ zum Backend-Verzeichnis. Die Datenbank ist anfangs leer.
    url: jdbc:h2:file:./data/lernraum
    username: sa
    password: ""
  sql:
    init:
      # Eine schema.sql wird erst im Unterricht erstellt.
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  address: 127.0.0.1
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
